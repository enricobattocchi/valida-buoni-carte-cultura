name: Rilascio
# Si avvia con il push di un tag di versione, per esempio:
#   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Ricava la versione dal tag
        run: |
          NOME="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAGGIORE MINORE CORREZIONE <<< "$NOME"
          # 1.2.3 diventa 10203: cresce sempre, come richiede Android.
          # 10# evita che un numero come 08 venga letto in ottale.
          CODICE=$(( 10#${MAGGIORE:-0} * 10000 + 10#${MINORE:-0} * 100 + 10#${CORREZIONE:-0} ))
          echo "VERSIONE=$NOME" >> "$GITHUB_ENV"
          echo "CODICE=$CODICE" >> "$GITHUB_ENV"

      - name: Prepara la chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Manca il segreto KEYSTORE_BASE64: vedi la sezione Rilascio del README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compila APK e AAB firmati
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease -PversionCode="$CODICE" -PversionName="$VERSIONE"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ValidaBuoniCarteCultura-$VERSIONE.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/ValidaBuoniCarteCultura-$VERSIONE.aab"

      - name: Prepara le note dal CHANGELOG
        run: |
          # Prende le righe tra "## <versione>" e la sezione successiva.
          awk -v v="## $VERSIONE" '$0 == v { dentro = 1; next } /^## / { dentro = 0 } dentro' \
            CHANGELOG.md > note.md
          if ! grep -q '[^[:space:]]' note.md; then
            echo "::error::Manca la sezione \"## $VERSIONE\" in CHANGELOG.md."
            exit 1
          fi
          cat >> note.md <<EOF

          ### Installazione

          Scarica \`ValidaBuoniCarteCultura-$VERSIONE.apk\` sul telefono e aprilo; serve Android 8.0 o successivo. Il file \`.aab\` serve solo per la pubblicazione sul Play Store.
          EOF

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Valida Buoni Carte Cultura $VERSIONE" --notes-file note.md
